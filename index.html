<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Planetarium 🪐</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="saturn.png">
</head>

<body>
    <div class="container">
        <section class="card">
            <h1>Cosmic Observatory</h1>
            <p>"Explore celestial bodies by selecting a hotspot"</p>
        </section>

        <section class="card">
            <img src="solar-system.avif" usemap="#controls" alt="solar system interactive diagram">

            <map name="controls">
                <area shape="circle" coords="" href="#sun" alt="sun">
            </map>
        </section>

        <section class="card">
            <h2>CELESTIAL DETAILS SECTION</h2>

            <section id="sun">
                <h3>Sun Details:</h3>
                <p><b>Temp:</b> 5,500 deg C</p>
                <p><b>Type:</b> Yellow Dwarf</p>
                <p><b>More: </b><a href="https://en.wikipedia.org/wiki/Sun">Wikipedia Page</a></p>
            </section>
        </section>
    </div>
    <script src="app.js"></script>
</body>

</html>
