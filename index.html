<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Planetarium 🪐</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="saturn.png">
</head>

<body>
    <div class="container">
        <section class="card">
            <h1>Cosmic Observatory</h1>
            <p>"Explore celestial bodies by selecting a hotspot"</p>
        </section>

        <section class="card">
            <img src="solar-system.avif" usemap="#controls" alt="solar system interactive diagram">

            <map name="controls">
                <area shape="circle" coords="" href="" alt="sun">
            </map>
        </section>
    </div>
    <script src="app.js"></script>
</body>

</html>
